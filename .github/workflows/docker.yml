name: Build & Publish Docker Image

on:
  # On push to main: build AND publish ghcr.io/agora-build/portal:latest + :<sha>.
  push:
    branches:
      - main
    # A v* tag publishes a release: :1.2.3, :1.2 and :latest.
    tags:
      - "v*"
  # On a PR into main: test, build and smoke test only, NEVER push.
  pull_request:
    branches:
      - main

# Only cancel PR runs — never cancel a main or release publish partway through.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: portal-ci-only
          POSTGRES_DB: agora_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run tests
        env:
          PORTAL_TEST_DATABASE_URL: postgres://postgres:portal-ci-only@localhost:5432/agora_portal_test
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/portal
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portal:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name portal -p 3002:3002 portal:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/ > /dev/null; then
              curl -fsS http://127.0.0.1:3002/api/projects > /dev/null
              echo "Smoke test passed"
              exit 0
            fi
            sleep 1
          done
          docker logs portal
          exit 1

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
